# rabbitmq.conf — configuração do broker para desenvolvimento local

# Carrega a topologia definida em definitions.json na inicialização.
# Isso garante que exchanges, filas e bindings já existam quando
# a aplicação conectar pela primeira vez.
management.load_definitions = /etc/rabbitmq/definitions.json

# Logs estruturados — facilita debug local
log.console = true
log.console.level = info
log.file = false

# Limites de recursos para dev local (evita consumir muita RAM)
vm_memory_high_watermark.relative = 0.4
disk_free_limit.absolute = 1GB

# Heartbeat — detecta conexões mortas em 60s
heartbeat = 60

# Consumer timeout — NACK automático se o consumer não responder em 30min
# Bom para dev: evita mensagens "presas" durante debug
consumer_timeout = 1800000
